[package]
name = "bpf"
version = "0.0.1"
edition = "2024"
description = "An eBPF library"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true

[dependencies]
bpf-tracing = { version = "0.0.5", optional = true }
bpf-tracing-include = { version = "0.0.6", optional = true }
glob = { version = "0.3.4", optional = true }
libbpf-cargo = "0.26.2"
libbpf-rs = "0.26.2"

[features]
default = ["build", "tracing"]
build = ["dep:glob"]
tracing = ["dep:bpf-tracing", "dep:bpf-tracing-include"]
